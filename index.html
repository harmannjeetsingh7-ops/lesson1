<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TypeScript Demo Page</title>
    <script type="text/javascript" src="calc.js"></script>
</head>
<body>
    <h1>Add 2 Numbers</h1>

    <input id="x" type="text" placeholder="Enter first #" />
    <input id="y" type="text" placeholder="Enter second #" />
    <button onclick="calculate()">Add</button>
    <p id="result"></p>

    <h2>Guess Number</h2>

    <input type="text" id="guess" placeholder="Enter a number from 1 to 10" />
    <button onclick="checkGuess()">Guess</button>
    <p id="guessResult"></p>
</body>
</html>
